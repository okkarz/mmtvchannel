<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream diagnostics — Myanmar TV</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #0b0b18; color: #f7f8fc;
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #868aa8; margin: 0 0 18px; font-size: 13px; }
  button { font: inherit; padding: 9px 16px; border-radius: 999px; border: 1px solid #312e81;
           background: #1f1f3d; color: inherit; cursor: pointer; }
  button:hover { background: #28285a; }
  button:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 12.5px; }
  th, td { text-align: right; padding: 6px 9px; border-bottom: 1px solid rgba(255,255,255,.09); }
  th:first-child, td:first-child { text-align: left; }
  th { color: #868aa8; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  .ok { color: #4ade80; }
  .warn { color: #fbbf24; }
  .bad { color: #f87171; }
  .dim { color: #868aa8; }
  code { background: #1f1f3d; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Stream diagnostics</h1>
<p class="sub">
  Loads each channel with the app's real hls.js configuration and reports how
  long it takes to fetch the first fragment, plus what the player actually
  receives versus what the broadcaster advertises.
</p>
<p>
  <button id="run">Run diagnostics</button>
  <button id="clear">Clear</button>
  <span id="state" class="dim"></span>
</p>
<table id="out"><thead></thead><tbody></tbody></table>

<script src="../vendor/hls.min.js"></script>
<script src="../data/channels.js"></script>
<script>
// Mirrors HLS_CONFIG in app.js — keep the two in step when tuning.
const HLS_CONFIG = {
  enableWorker: true,
  abrEwmaDefaultEstimate: 600000,
  startLevel: -1,
  liveSyncDuration: 15,
  liveMaxLatencyDuration: 30,
  maxLiveSyncPlaybackRate: 1.1,
  maxBufferLength: 30,
  maxMaxBufferLength: 60,
  backBufferLength: 15,
  maxBufferSize: 40 * 1000 * 1000,
  abrMaxWithRealBitrate: true,
  abrBandWidthFactor: 0.8,
  abrBandWidthUpFactor: 0.6,
  abrEwmaFastLive: 3,
  abrEwmaSlowLive: 9,
  highBufferWatchdogPeriod: 2,
  nudgeOffset: 0.2,
  nudgeMaxRetry: 5,
  manifestLoadingTimeOut: 8000,
  manifestLoadingMaxRetry: 4,
  manifestLoadingRetryDelay: 300,
  levelLoadingTimeOut: 8000,
  levelLoadingMaxRetry: 4,
  levelLoadingRetryDelay: 300,
  fragLoadingTimeOut: 12000,
  fragLoadingMaxRetry: 6,
  fragLoadingRetryDelay: 300,
  appendErrorMaxRetry: 5,
};

// Optional proxy for hosts that block browsers; set from ?proxy=… in the URL.
const PROXY = new URLSearchParams(location.search).get('proxy') || '';

const HEAD = ['channel', 'manifest', 'playlist', '1st frag', 'frag KB', 'levels', 'delay', 'notes'];
const els = { head: document.querySelector('#out thead'), body: document.querySelector('#out tbody'), state: document.querySelector('#state') };

els.head.innerHTML = '<tr>' + HEAD.map((h) => `<th>${h}</th>`).join('') + '</tr>';

function row(name) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${name}</td>` + HEAD.slice(1).map(() => '<td class="dim">—</td>').join('');
  els.body.appendChild(tr);
  return tr;
}

function setCell(tr, index, text, cls) {
  const td = tr.children[index + 1];
  td.textContent = text;
  td.className = cls || '';
}

function streamUrl(channel) {
  if (!PROXY) return channel.url;
  return `${PROXY.replace(/\/$/, '')}?url=${encodeURIComponent(channel.url)}`;
}

/** Load one channel and collect timings until the first fragment arrives. */
function probe(channel) {
  return new Promise((resolve) => {
    const tr = row(channel.name);
    const timings = {};
    const t0 = performance.now();
    const levels = { list: [], sizes: [] };
    const notes = [];
    const video = document.createElement('video');
    video.muted = true;

    let done = false;
    const finish = (reason) => {
      if (done) return;
      done = true;
      clearTimeout(guard);
      try { hls.destroy(); } catch { /* noop */ }
      video.remove();
      resolve({ channel, timings, levels, notes, reason });
    };

    const hls = new window.Hls(HLS_CONFIG);

    hls.on(window.Hls.Events.MANIFEST_LOADED, () => { timings.manifest = performance.now() - t0; });

    hls.on(window.Hls.Events.LEVEL_LOADED, () => {
      if (timings.playlist === undefined) timings.playlist = performance.now() - t0;
    });

    hls.on(window.Hls.Events.MANIFEST_PARSED, (_e, data) => {
      levels.list = data.levels || [];
    });

    hls.on(window.Hls.Events.FRAG_LOADED, (_e, data) => {
      if (timings.frag === undefined) {
        timings.frag = performance.now() - t0;
        const size = data.frag && data.frag.stats ? data.frag.stats.total : 0;
        levels.sizes.push(size);
        finish('first fragment');
      }
    });

    hls.on(window.Hls.Events.ERROR, (_e, data) => {
      if (data.fatal) {
        notes.push(`${data.type}/${data.details}`);
        finish('fatal error');
      } else if (/timeout|LoadError/i.test(data.details || '')) {
        notes.push(data.details);
      }
    });

    const guard = setTimeout(() => finish('timeout'), 25000);

    hls.loadSource(streamUrl(channel));
    hls.attachMedia(video);
    video.play().catch(() => { /* decoding is not needed for these timings */ });

    // paint progressively so results appear as they arrive
    const tick = setInterval(() => {
      if (done) { clearInterval(tick); return; }
      if (timings.manifest) setCell(tr, 0, `${Math.round(timings.manifest)} ms`);
      if (timings.playlist) setCell(tr, 1, `${Math.round(timings.playlist)} ms`);
      if (timings.frag) setCell(tr, 2, `${Math.round(timings.frag)} ms`, 'ok');
      if (levels.sizes[0]) setCell(tr, 3, `${Math.round(levels.sizes[0] / 1024)}`);
      if (levels.list.length) setCell(tr, 4, String(levels.list.length));
    }, 250);
  });
}

function summarise(result) {
  const tr = els.body.querySelectorAll('tr')[els.body.querySelectorAll('tr').length - 1];
  const { timings, levels, notes, reason } = result;

  setCell(tr, 2, timings.frag ? `${Math.round(timings.frag)} ms` : reason,
    timings.frag ? 'ok' : 'bad');
  if (levels.sizes[0]) setCell(tr, 3, String(Math.round(levels.sizes[0] / 1024)));
  setCell(tr, 4, String(levels.list.length));

  // Is the delay to the live edge what the config asked for?
  const target = HLS_CONFIG.liveSyncDuration;
  setCell(tr, 5, `~${target}s`, 'dim');

  // Do the advertised renditions differ, or is this a mislabelled single encode?
  const res = levels.list.map((l) => (l.width && l.height ? `${l.width}x${l.height}` : '?'));
  const rates = levels.list.map((l) => l.bitrate || 0);
  if (levels.list.length > 1) {
    if (new Set(res).size === 1) notes.push(`all tiers are ${res[0]} — switching gains nothing`);
    else if (rates.length > 1 && Math.max(...rates) / Math.min(...rates) < 1.3) notes.push('tiers barely differ');
  }
  setCell(tr, 6, notes.join('; ') || '—', notes.length ? 'warn' : 'dim');
}

document.querySelector('#run').addEventListener('click', async () => {
  const btn = document.querySelector('#run');
  btn.disabled = true;
  els.body.innerHTML = '';
  const channels = (window.CHANNELS || []).filter((c) => !c.offline);

  for (let i = 0; i < channels.length; i += 1) {
    els.state.textContent = ` (${i + 1}/${channels.length}) ${channels[i].name}…`;
    // eslint-disable-next-line no-await-in-loop
    const result = await probe(channels[i]);
    summarise(result);
  }
  els.state.textContent = ' done';
  btn.disabled = false;
});

document.querySelector('#clear').addEventListener('click', () => {
  els.body.innerHTML = '';
  els.state.textContent = '';
});
</script>
</body>
</html>

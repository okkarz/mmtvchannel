<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Myanmar TV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#141432"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- screen -->
  <rect x="96" y="146" width="320" height="214" rx="44" fill="#FFFFFF"/>
  <rect x="96" y="146" width="320" height="214" rx="44" fill="none" stroke="#0B0B18" stroke-opacity=".08" stroke-width="4"/>

  <!-- play -->
  <path d="M222 205 L222 301 L306 253 Z" fill="url(#play)"/>

  <!-- Myanmar-inspired tricolour underline -->
  <g>
    <rect x="96" y="392" width="96" height="18" rx="9" fill="#FBBF24"/>
    <rect x="208" y="392" width="96" height="18" rx="9" fill="#22C55E"/>
    <rect x="320" y="392" width="96" height="18" rx="9" fill="#EF4444"/>
